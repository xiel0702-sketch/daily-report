<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>W46四页周报 · 盈峰投资</title>
  <link rel="icon" type="image/png" href="../assets/logo-mark.png">
  <link rel="stylesheet" href="weekly-presentation.css?v=20261115-w46-r3">
  <script src="weekly-presentation-W46.js?v=20261115-w46-r3" defer></script>
</head>
<body class="week-w46">
  <a class="skip-link" href="#deck">跳到周报正文</a>

  <header class="toolbar" aria-label="周报工具栏">
    <a class="brand" href="../?v=20261115-w46-r3#weekly/2026-W46" aria-label="盈峰投资，返回周报网页">
      <img src="../assets/logo-mark.png" width="34" height="34" alt="">
      <span class="brand-name">盈峰投资<small>INFORE INVESTMENT</small></span>
    </a>

    <div class="toolbar-title">
      <h1 id="reportTitle">W46四页周报</h1>
    </div>

    <div class="toolbar-actions">
      <a class="text-link" href="../?v=20261115-w46-r3#weekly/2026-W46">周报网页<span aria-hidden="true"> ↗</span></a>
      <button id="presentationToggle" type="button" aria-pressed="false" aria-controls="deck" title="演示模式下可用左右方向键翻页" disabled>
        <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="11" rx="1"></rect><path d="M10 14v4M6 18h8"></path></svg>
        <span class="button-label">演示模式</span>
      </button>
      <button id="fullscreenToggle" type="button" aria-pressed="false" title="切换全屏" hidden>
        <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"></path></svg>
        <span class="button-label">全屏</span>
      </button>
    </div>
  </header>

  <nav class="chapter-bar" aria-label="周报章节">
    <div class="chapter-picker">
      <label for="chapterSelect">章节</label>
      <select id="chapterSelect" aria-controls="deck" disabled>
        <option value="">正在载入章节…</option>
      </select>
    </div>
    <p class="chapter-cutoff">截至北京时间 2026年11月15日 22:45</p>
    <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
  </nav>

  <p id="meetingNotice" class="notice" role="alert" hidden></p>

  <main id="deck" class="main deck" aria-label="W46完整周报正文" aria-busy="true" tabindex="-1">
    <div class="page-loading" role="status">
      <span class="loading-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><rect x="9" y="7" width="23" height="28" rx="2"></rect><path d="M15 14h11M15 20h11M15 26h7M9 12H5v20a3 3 0 0 0 3 3h18"></path></svg>
      </span>
      <h2 class="loading-title">正在载入周报</h2>
      <p class="loading-description">请稍候</p>
    </div>
    <noscript>
      <style>.page-loading{display:none!important}</style>
      <section class="error-state" aria-labelledby="noscriptTitle">
        <h2 id="noscriptTitle">请启用 JavaScript 阅读周报</h2>
        <p>也可以返回周报网页阅读文字版。</p>
        <div class="error-actions">
          <a href="../?v=20261115-w46-r3#weekly/2026-W46">返回周报网页</a>
        </div>
      </section>
    </noscript>
  </main>

  <nav class="meeting-controls" aria-label="逐页切换" hidden>
    <button id="previousPage" type="button" aria-label="上一页" title="上一页" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"></path></svg>
      <span>上一页</span>
    </button>
    <span id="pageCounter" class="counter" aria-label="正在载入页码">— / —</span>
    <button id="nextPage" type="button" aria-label="下一页" title="下一页" disabled>
      <span>下一页</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"></path></svg>
    </button>
  </nav>

  <div id="meetingStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
